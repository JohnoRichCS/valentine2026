<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Will you be my Valentine?</title>
  <style>
    body{
      font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
      margin:0; min-height:100vh; display:grid; place-items:center;
      background:#fff0f6;
    }
    .card{
      background:#fff; width:min(560px,92vw);
      padding:28px 22px; border-radius:18px;
      box-shadow:0 10px 30px rgba(0,0,0,.12);
      text-align:center; position:relative; overflow:hidden;
    }
    h1{margin:0 0 14px; font-size:28px;}
    img{width:min(360px,85%); border-radius:12px;}
    .btnRow{margin-top:18px; display:flex; gap:12px; justify-content:center;}
    button{
      border:0; border-radius:999px; padding:12px 18px;
      font-size:16px; cursor:pointer; transition:transform .12s ease;
      user-select:none;
    }
    button:active{transform:scale(.98);}
    #yes{background:#ff4d6d; color:#fff;}
    #no{background:#e9ecef; color:#212529; position:absolute;}
    .note{margin-top:10px; color:#6c757d; min-height:22px;}

    .overlay{
      position:fixed; inset:0; display:none; place-items:center;
      background:rgba(0,0,0,.45); padding:16px;
    }
    .overlay .card{width:min(520px,92vw);}
  </style>
</head>
<body>
  <div class="card" id="wrap">
    <h1 id="question">Will you be my Valentine?</h1>

    <!-- Swap this GIF link if you want -->
    <img id="pic"
      src="https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExbWQ2c2V4d3A0a2Z5dHdwM3Nma2FzbjFqM2FhY2t1dW5mN2VjYyZlcD12MV9naWZzX3NlYXJjaCZjdD1n/3oriO0OEd9QIDdllqo/giphy.gif"
      alt="cute gif" />

    <div class="btnRow">
      <button id="yes">Yes</button>
      <button id="no">No</button>
    </div>

    <div class="note" id="note"></div>
  </div>

  <div class="overlay" id="overlay">
    <div class="card">
      <h1 id="yayTitle">Yay!! 💖</h1>
      <p id="yayMsg">See you sooonnn 😤</p>
      <button id="close" style="background:#ff4d6d;color:#fff;margin-top:10px;">Close</button>
    </div>
  </div>

  <script>
    const wrap = document.getElementById("wrap");
    const yes = document.getElementById("yes");
    const no = document.getElementById("no");
    const note = document.getElementById("note");
    const overlay = document.getElementById("overlay");
    const closeBtn = document.getElementById("close");

    let noCount = 0;
    const messages = [
      "are you sure? 😭",
      "c’monnn 😔",
      "pleaseeee 🥺",
      "don’t do me like that 💔",
      "ok ok I get it 😈"
    ];

    function clamp(v, min, max){ return Math.max(min, Math.min(v, max)); }

    function placeNo(x, y){
      const rect = wrap.getBoundingClientRect();
      const btnRect = no.getBoundingClientRect();

      const minX = 12;
      const minY = 12 + 52; // keep it below the title area
      const maxX = rect.width - btnRect.width - 12;
      const maxY = rect.height - btnRect.height - 12;

      no.style.left = clamp(x, minX, maxX) + "px";
      no.style.top  = clamp(y, minY, maxY) + "px";
    }

    requestAnimationFrame(() => {
      // start "No" near where it would normally be
      placeNo(wrap.clientWidth/2 + 70, wrap.clientHeight/2 + 40);
    });

    function randomizeNo(){
      placeNo(Math.random()*wrap.clientWidth, Math.random()*wrap.clientHeight);
    }

    function growYes(){
      const scale = Math.min(1 + noCount * 0.12, 6);
      yes.style.transform = `scale(${scale})`;
    }

    function dodge(){
      noCount++;
      note.textContent = messages[(noCount - 1) % messages.length];
      growYes();
      randomizeNo();
    }

    no.addEventListener("mouseenter", dodge);
    no.addEventListener("touchstart", (e) => { e.preventDefault(); dodge(); }, { passive:false });

    yes.addEventListener("click", () => { overlay.style.display = "grid"; });
    closeBtn.addEventListener("click", () => { overlay.style.display = "none"; });
    overlay.addEventListener("click", (e) => {
      if (e.target === overlay) overlay.style.display = "none";
    });
  </script>
</body>
</html>
