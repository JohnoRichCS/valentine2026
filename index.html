<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Valentine</title>

<style>
:root{
  --bg1:#ffe3ee;
  --bg2:#fff0f6;
  --card:#ffffff;
  --accent:#ff4d6d;
  --muted:#6c757d;
  --shadow: 0 16px 50px rgba(0,0,0,.14);
  --radius:22px;
}

body{
  margin:0;
  min-height:100vh;
  display:grid;
  place-items:center;
  font-family: system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
  background: radial-gradient(circle at 20% 15%, var(--bg1), var(--bg2));
  overflow:hidden;
}

/* ===== hearts background (behind everything) ===== */
#heartsLayer{
  position:fixed;
  inset:0;
  pointer-events:none;
  z-index:0;
  overflow:hidden;
  display:none;
}

/* falling hearts (emoji) */
.heart{
  position:absolute;
  top:-12vh;
  line-height:1;
  opacity:.75;
  filter: drop-shadow(0 6px 8px rgba(0,0,0,.08));
  animation: fall linear infinite;
  user-select:none;
}
@keyframes fall{
  to { transform: translateY(125vh) rotate(360deg); }
}

/* burst hearts (emoji) */
.burst{
  position:absolute;
  left:var(--x);
  top:var(--y);
  transform: translate(-50%, -50%);
  line-height:1;
  opacity:0;
  animation: burst 900ms ease-out forwards;
  user-select:none;
  filter: drop-shadow(0 6px 10px rgba(0,0,0,.10));
}
@keyframes burst{
  0%   { opacity:0; transform: translate(-50%,-50%) scale(.6); }
  10%  { opacity:1; }
  100% { opacity:0; transform: translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))) scale(1.25); }
}

/* ===== card ===== */
.card{
  width:min(900px, 92vw);
  background:var(--card);
  border-radius:var(--radius);
  box-shadow:var(--shadow);
  padding:26px 22px 22px;
  z-index:5;
  position:relative;
}

h1{
  margin: 6px 0 18px;
  text-align:center;
  font-size: clamp(22px, 3vw, 34px);
}

/* ===== normal mode ===== */
.layout{
  display:grid;
  gap:14px;
  justify-items:center;
}

.mediaWrap{
  width:min(440px, 90%);
  aspect-ratio: 1/1;
  border-radius:18px;
  overflow:hidden;
  background:#f2f2f2;
  box-shadow: 0 10px 26px rgba(0,0,0,.10);
}
.mediaWrap img{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
}

.caption{
  text-align:center;
  color:#3a3a3a;
  font-size:17px;
  font-weight:600;
  line-height:1.35;
  min-height:86px;
  max-width: min(680px, 92%);
  padding: 0 10px;
  word-break: break-word;
}

.btnRow{
  display:flex;
  gap:12px;
  justify-content:center;
  flex-wrap:wrap;
}
button{
  border:0;
  border-radius:999px;
  padding:12px 18px;
  font-size:16px;
  cursor:pointer;
  user-select:none;
  transition: transform .12s ease;
}
button:active{ transform: scale(.98); }

#yesBtn{ background:var(--accent); color:white; box-shadow: 0 12px 18px rgba(255,77,109,.22); }
#noBtn{ background:#e9ecef; }

/* ===== celebration ===== */
#celebration{ display:none; }

.celeGrid{
  display:grid;
  grid-template-columns: 170px 1fr 170px;
  grid-template-rows: auto auto;
  gap:18px;
  align-items:center;
  justify-items:center;
}

.centerBlock{
  grid-column: 2;
  grid-row: 1 / span 2;
  width:min(440px, 100%);
  text-align:center;
  z-index:6;
}

.centerMedia{
  width:min(440px, 100%);
  aspect-ratio:1/1;
  border-radius:18px;
  overflow:hidden;
  background:#f2f2f2;
  box-shadow: 0 10px 26px rgba(0,0,0,.10);
}
.centerMedia img{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
}

.celeCaption{
  margin-top:12px;
  font-size: 18px;
  font-weight: 750;
  color:#232323;
  line-height:1.25;
}

.tile{
  width:160px;
  height:160px;
  border-radius:18px;
  overflow:hidden;
  box-shadow: 0 12px 22px rgba(0,0,0,.12);
  background:#fff;
  animation: floaty 2.9s ease-in-out infinite;
}
.tile img{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
}
@keyframes floaty{
  0%,100%{ transform: translateY(0); }
  50%{ transform: translateY(-10px); }
}

.t1{ animation-duration:2.6s; }
.t2{ animation-duration:3.0s; }
.t3{ animation-duration:3.2s; }
.t4{ animation-duration:2.8s; }
.t5{ animation-duration:3.3s; }
.t6{ animation-duration:2.7s; }
.t7{ animation-duration:3.1s; }

.leftTop{ grid-column:1; grid-row:1; }
.leftMid{ grid-column:1; grid-row:2; }
.rightTop{ grid-column:3; grid-row:1; }
.rightMid{ grid-column:3; grid-row:2; }

.bottomRow{
  grid-column: 1 / span 3;
  grid-row: 3;
  display:flex;
  gap:14px;
  justify-content:center;
  flex-wrap:wrap;
}

#restartBtn{
  background:#111;
  color:#fff;
  margin-top: 14px;
  padding:10px 16px;
  font-size: 14px;
  opacity:.9;
}
#restartBtn:hover{ opacity:1; }

@media (max-width: 760px){
  .celeGrid{
    grid-template-columns: 1fr;
    grid-template-rows: auto;
  }
  .centerBlock{ grid-column:1; grid-row:auto; }
  .leftTop,.leftMid,.rightTop,.rightMid{ grid-column:1; grid-row:auto; }
  .bottomRow{ grid-column:1; grid-row:auto; }
  .tile{ width:min(78vw, 240px); height:200px; }
}

/* ===== NO step effects ===== */

/* calmer continuous shake (alex step) */
.shakeLoop{
  animation: shakeLoop .35s linear infinite;
}
@keyframes shakeLoop{
  0%{ transform: translate(0,0) rotate(0); }
  25%{ transform: translate(-3px, 2px) rotate(-.4deg); }
  50%{ transform: translate(3px, -2px) rotate(.4deg); }
  75%{ transform: translate(-2px, 2px) rotate(-.3deg); }
  100%{ transform: translate(0,0) rotate(0); }
}

/* dramatic zoom on main image (alex step) */
.zoomIn{
  transform-origin: center;
  animation: zoomIn 1.2s ease forwards;
}
@keyframes zoomIn{
  from{ transform: scale(1); }
  to{ transform: scale(1.18); }
}

/* fade in slow (chris step) */
.fadeInSlow{
  opacity:0;
  animation: fadeIn 4.6s ease forwards;
}
@keyframes fadeIn{
  to{ opacity:1; }
}
</style>
</head>

<body>
  <div id="heartsLayer"></div>

  <div class="card" id="card">
    <h1 id="questionTitle">Do you want to be my Valentine?</h1>

    <div id="normalMode" class="layout">
      <div class="mediaWrap">
        <img id="mainImg" src="rose.gif" alt="main">
      </div>

      <div class="caption" id="caption"></div>

      <div class="btnRow">
        <button id="yesBtn">YES</button>
        <button id="noBtn">NO</button>
      </div>
    </div>

    <div id="celebration">
      <div class="celeGrid">
        <div class="tile t1 leftTop"><img src="sponge.gif" alt=""></div>
        <div class="tile t2 leftMid"><img src="pooh.gif" alt=""></div>

        <div class="centerBlock">
          <div class="centerMedia">
            <img id="centerImg" src="milk.gif" alt="milk">
          </div>
          <div class="celeCaption" id="celeCaption">
            AHHH HAPPY VALENTINE'S DAY!!! 🥰♥ ILY SM!!!!!!
          </div>
          <button id="restartBtn">Start Over</button>
        </div>

        <div class="tile t3 rightTop"><img src="ppj.gif" alt=""></div>
        <div class="tile t4 rightMid"><img src="milly.gif" alt=""></div>

        <div class="bottomRow">
          <div class="tile t5"><img src="mocha.gif" alt=""></div>
          <div class="tile t6"><img src="gru.gif" alt=""></div>
          <div class="tile t7"><img src="tooth.gif" alt=""></div>
        </div>
      </div>
    </div>
  </div>

  <audio id="player" preload="auto"></audio>

<script>
const IMG_5053_FILE = "IMG_5053.jpeg";

const noSteps = [
  { img: "Luther.jpg", audio: "among1.mp3",
    caption: "Wowww, you really pressed no? Must be a mistake 😅" },
  { img: "denzel.png", audio: "among2.mp3",
    caption: "You know what they say. Fool me once, shame on me. Fool me twice... I think you get the idea so stop playing around 😐" },
  { img: IMG_5053_FILE, audio: "among3.mp3",
    caption: "You really don't want to be my valentine that bad? 😞 Fine, see if I care! Press again to confirm it 🤷🏽‍♂️" },
  { img: "alex.jpg", audio: "among4.mp3",
    caption: "LISTEN UP YOU CHOCOLATE COVERED GIRAFFE 🤬, BE MY VALENTINE NOW OR SUFFER MY WRATH! (Last chance, I'm warning you)",
    shake: true, zoom: true },
  { img: "chris.jpg", audio: "chris.mp3",
    caption: "You asked for it, now its time to fuck around and find out 🥊 This is going to hurt me more than it hurts you, buuut if you want flowers instead, I suggest you click yes 🥰",
    fadeSlow: true }
];

let noCount = 0;
let celebrating = false;

const mainImg = document.getElementById("mainImg");
const caption = document.getElementById("caption");
const yesBtn = document.getElementById("yesBtn");
const noBtn = document.getElementById("noBtn");
const player = document.getElementById("player");
const card = document.getElementById("card");
const normalMode = document.getElementById("normalMode");
const celebration = document.getElementById("celebration");
const title = document.getElementById("questionTitle");
const restartBtn = document.getElementById("restartBtn");

const HEART_COLORS = ["#ff4d6d", "#ff6fa5", "#ff2e63", "#ff8fab", "#ff1744"];

function stopAllEffects(){
  card.classList.remove("shakeLoop");
  mainImg.classList.remove("zoomIn");
  mainImg.classList.remove("fadeInSlow");
}

function playAudio(src, {loop=false} = {}){
  try{
    player.pause();
    player.currentTime = 0;
    player.loop = loop;
    player.src = src;
    player.play();
  }catch(e){}
}

function applyStep(i){
  const s = noSteps[i];
  if (!s) return;

  stopAllEffects();

  // reset image classes + reflow
  mainImg.className = "";
  void mainImg.offsetWidth;

  mainImg.src = s.img;

  if (s.fadeSlow) mainImg.classList.add("fadeInSlow");
  if (s.zoom) mainImg.classList.add("zoomIn");
  if (s.shake) card.classList.add("shakeLoop");

  caption.textContent = s.caption;
  playAudio(s.audio, {loop:false});
}

noBtn.addEventListener("click", () => {
  if (celebrating) return;
  noCount++;
  const idx = Math.min(noCount, noSteps.length) - 1;
  applyStep(idx);
});

yesBtn.addEventListener("click", () => {
  if (celebrating) return;
  celebrating = true;

  stopAllEffects();

  title.textContent = "I KNEW YOU'D SAY YES!";
  normalMode.style.display = "none";
  celebration.style.display = "block";

  // heart burst first, then start rain
  burstHearts(42);
  startHearts();

  // loop YES audio
  playAudio("valentine.mp3", {loop:true});
});

restartBtn.addEventListener("click", () => {
  celebrating = false;
  noCount = 0;

  stopAllEffects();
  stopHearts();

  try{
    player.pause();
    player.currentTime = 0;
    player.loop = false;
  }catch(e){}

  title.textContent = "Do you want to be my Valentine?";
  celebration.style.display = "none";
  normalMode.style.display = "grid";
  mainImg.src = "rose.gif";
  caption.textContent = "";
});

function randomColor(){
  return HEART_COLORS[Math.floor(Math.random() * HEART_COLORS.length)];
}

/* HEART RAIN (emoji) */
function startHearts(){
  const layer = document.getElementById("heartsLayer");
  layer.style.display = "block";
  layer.innerHTML = "";

  const count = 36;
  for (let i=0; i<count; i++){
    const h = document.createElement("span");
    h.className = "heart";
    h.textContent = "♥";

    const left = Math.random() * 100;
    const size = 14 + Math.random() * 22;
    const duration = 3 + Math.random() * 5.2;
    const delay = Math.random() * 3.2;
    const opacity = 0.55 + Math.random() * 0.35;

    h.style.left = left + "vw";
    h.style.fontSize = size + "px";
    h.style.opacity = opacity;
    h.style.color = randomColor();
    h.style.animationDuration = duration + "s";
    h.style.animationDelay = delay + "s";

    layer.appendChild(h);
  }
}

/* HEART BURST EXPLOSION (emoji) */
function burstHearts(n=36){
  const layer = document.getElementById("heartsLayer");
  layer.style.display = "block";

  // center burst roughly in the center of the card
  const rect = card.getBoundingClientRect();
  const cx = rect.left + rect.width/2;
  const cy = rect.top + rect.height/2;

  for (let i=0; i<n; i++){
    const b = document.createElement("span");
    b.className = "burst";
    b.textContent = "♥";

    // random direction
    const angle = Math.random() * Math.PI * 2;
    const dist = 80 + Math.random() * 160; // how far it flies
    const dx = Math.cos(angle) * dist;
    const dy = Math.sin(angle) * dist;

    const size = 14 + Math.random() * 18;
    const delay = Math.random() * 120; // small stagger

    b.style.setProperty("--x", cx + "px");
    b.style.setProperty("--y", cy + "px");
    b.style.setProperty("--dx", dx + "px");
    b.style.setProperty("--dy", dy + "px");

    b.style.fontSize = size + "px";
    b.style.color = randomColor();
    b.style.animationDelay = delay + "ms";

    layer.appendChild(b);

    // remove after animation
    setTimeout(() => b.remove(), 1200);
  }
}

function stopHearts(){
  const layer = document.getElementById("heartsLayer");
  layer.style.display = "none";
  layer.innerHTML = "";
}
</script>

</body>
</html>
