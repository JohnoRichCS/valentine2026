<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Will you be my Valentine?</title>
  <style>
    :root{
      --bg:#fff0f6;
      --card:#ffffff;
      --shadow: 0 12px 40px rgba(0,0,0,.12);
      --accent:#ff4d6d;
      --muted:#6c757d;
      --radius:20px;
    }
    body{
      margin:0;
      min-height:100vh;
      display:grid;
      place-items:center;
      background: radial-gradient(circle at 30% 20%, #ffe0ea, var(--bg));
      font-family: system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
    }
    .card{
      width:min(640px, 92vw);
      background:var(--card);
      border-radius:var(--radius);
      box-shadow:var(--shadow);
      padding:26px 22px 22px;
      text-align:center;
      position:relative;
    }
    h1{
      margin:4px 0 16px;
      font-size: clamp(22px, 3.2vw, 32px);
      letter-spacing:.2px;
    }

    /* MEDIA BOX: No button lives inside here only */
    .mediaWrap{
      width:min(420px, 88%);
      aspect-ratio: 1 / 1;
      margin: 0 auto;
      border-radius:16px;
      overflow:hidden;
      position:relative;
      box-shadow: 0 10px 26px rgba(0,0,0,.10);
      background:#f6f6f6;
    }
    .mediaWrap img,
    .mediaWrap video{
      width:100%;
      height:100%;
      object-fit:cover;
      display:block;
    }

    /* No button floats INSIDE the mediaWrap */
    #noFloat{
      position:absolute;
      left: 12px;
      top: 12px;
      padding: 10px 14px;
      border-radius:999px;
      border:0;
      cursor:pointer;
      background:#e9ecef;
      color:#212529;
      box-shadow: 0 8px 18px rgba(0,0,0,.12);
      transition: transform .12s ease;
      z-index: 2;
      user-select:none;
      touch-action: manipulation;
    }
    #noFloat:active{ transform: scale(.98); }

    .btnRow{
      margin-top:18px;
      display:flex;
      justify-content:center;
      gap:12px;
      flex-wrap:wrap;
    }
    button.primary{
      background:var(--accent);
      color:white;
      border:0;
      padding:12px 18px;
      border-radius:999px;
      font-size:16px;
      cursor:pointer;
      box-shadow: 0 10px 18px rgba(255,77,109,.25);
      transition: transform .12s ease;
      user-select:none;
    }
    button.primary:active{ transform: scale(.98); }

    /* Reserve space so text never gets covered */
    .note{
      margin-top:12px;
      color:var(--muted);
      min-height: 26px;
      font-size: 15px;
    }

    /* Modal */
    .overlay{
      position:fixed; inset:0;
      background: rgba(0,0,0,.45);
      display:none;
      place-items:center;
      padding:16px;
      z-index: 50;
    }
    .modal{
      width:min(560px, 92vw);
      background:white;
      border-radius:18px;
      padding:18px 18px 16px;
      box-shadow: var(--shadow);
      text-align:center;
      position:relative;
    }
    .modal h2{ margin:8px 0 6px; font-size:28px; }
    .modal p{ margin: 0 0 10px; color:var(--muted); }

    /* Confetti canvas */
    #confetti{
      position:fixed;
      inset:0;
      pointer-events:none;
      z-index: 60;
      display:none;
    }
  </style>
</head>

<body>
  <canvas id="confetti"></canvas>

  <div class="card">
    <h1 id="question">Will you be my Valentine?</h1>

    <div class="mediaWrap" id="mediaWrap">
      <!-- swap to <video> if you want -->
      <img id="media" src="https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExbWQ2c2V4d3A0a2Z5dHdwM3Nma2FzbjFqM2FhY2t1dW5mN2VjYyZlcD12MV9naWZzX3NlYXJjaCZjdD1n/3oriO0OEd9QIDdllqo/giphy.gif" alt="cute gif" />
      <button id="noFloat">No</button>
    </div>

    <div class="btnRow">
      <button class="primary" id="yesBtn">Yes</button>
    </div>

    <div class="note" id="note"></div>
  </div>

  <div class="overlay" id="overlay">
    <div class="modal">
      <h2 id="yayTitle">Yay!! 💖</h2>
      <p id="yayMsg">See you sooonnn 😤</p>
      <button class="primary" id="closeBtn">Close</button>
    </div>
  </div>

  <!-- Optional sounds (put your own files in repo and change src) -->
  <audio id="sfxYes" src="yes.mp3" preload="auto"></audio>
  <audio id="sfxNo"  src="no.mp3" preload="auto"></audio>

  <script>
    // ====== EASY CUSTOMIZATION ======
    const CONFIG = {
      // If you want video, set useVideo:true and put a video URL below.
      useVideo: false,
      mediaSrc: "https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExbWQ2c2V4d3A0a2Z5dHdwM3Nma2FzbjFqM2FhY2t1dW5mN2VjYyZlcD12MV9naWZzX3NlYXJjaCZjdD1n/3oriO0OEd9QIDdllqo/giphy.gif",

      // After N dodges, optionally let "No" become clickable (set to null to never allow)
      allowNoAfter: 5,

      // Messages shown after each dodge
      messages: [
        "are you sure? 😭",
        "c’monnn 😔",
        "pleaseeee 🥺",
        "don’t do me like that 💔",
        "ok ok… last chance 😈"
      ]
    };

    const mediaWrap = document.getElementById("mediaWrap");
    const noBtn = document.getElementById("noFloat");
    const yesBtn = document.getElementById("yesBtn");
    const note = document.getElementById("note");
    const overlay = document.getElementById("overlay");
    const closeBtn = document.getElementById("closeBtn");
    const sfxYes = document.getElementById("sfxYes");
    const sfxNo = document.getElementById("sfxNo");

    // Swap media to video if desired
    const mediaEl = document.getElementById("media");
    if (CONFIG.useVideo) {
      const v = document.createElement("video");
      v.src = CONFIG.mediaSrc;
      v.autoplay = true;
      v.loop = true;
      v.muted = false; // note: browsers may require user interaction to unmute
      v.playsInline = true;
      v.controls = false;
      v.id = "media";
      mediaEl.replaceWith(v);
    } else {
      mediaEl.src = CONFIG.mediaSrc;
    }

    let noCount = 0;
    let hoverTimer = null;

    function clamp(v, min, max){ return Math.max(min, Math.min(v, max)); }

    function moveNoRandom() {
      const wrapRect = mediaWrap.getBoundingClientRect();
      const btnRect = noBtn.getBoundingClientRect();

      // coordinates relative to mediaWrap
      const maxX = wrapRect.width - btnRect.width - 10;
      const maxY = wrapRect.height - btnRect.height - 10;
      const x = Math.random() * maxX + 5;
      const y = Math.random() * maxY + 5;

      noBtn.style.left = x + "px";
      noBtn.style.top  = y + "px";
    }

    function dodgeNo() {
      // If you want it to become clickable after a while
      if (CONFIG.allowNoAfter !== null && noCount >= CONFIG.allowNoAfter) return;

      noCount++;
      note.textContent = CONFIG.messages[(noCount - 1) % CONFIG.messages.length];

      // tiny sound (optional; will fail silently if file missing)
      try { sfxNo.currentTime = 0; sfxNo.play(); } catch(e){}

      moveNoRandom();
    }

    // Desktop: dodge on hover, but with a small delay so it’s not “impossible”
    noBtn.addEventListener("mouseenter", () => {
      clearTimeout(hoverTimer);
      hoverTimer = setTimeout(dodgeNo, 120);
    });
    noBtn.addEventListener("mouseleave", () => clearTimeout(hoverTimer));

    // Mobile: dodge on tap
    noBtn.addEventListener("touchstart", (e) => {
      e.preventDefault();
      dodgeNo();
    }, { passive:false });

    // Optional: if No becomes clickable after allowNoAfter
    noBtn.addEventListener("click", () => {
      if (CONFIG.allowNoAfter !== null && noCount >= CONFIG.allowNoAfter) {
        note.textContent = "Wow… you actually clicked No 😭 (refresh to try again)";
      }
    });

    // YES -> modal + effects
    yesBtn.addEventListener("click", () => {
      overlay.style.display = "grid";
      try { sfxYes.currentTime = 0; sfxYes.play(); } catch(e){}
      launchConfetti(1400);
    });
    closeBtn.addEventListener("click", () => overlay.style.display = "none");
    overlay.addEventListener("click", (e) => { if (e.target === overlay) overlay.style.display = "none"; });

    // ====== SIMPLE CONFETTI (no libraries) ======
    const confetti = document.getElementById("confetti");
    const ctx = confetti.getContext("2d");
    let pieces = [];
    let animId = null;

    function resizeCanvas(){
      confetti.width = window.innerWidth;
      confetti.height = window.innerHeight;
    }
    window.addEventListener("resize", resizeCanvas);
    resizeCanvas();

    function launchConfetti(ms=1200){
      confetti.style.display = "block";
      pieces = Array.from({length: 120}, () => ({
        x: Math.random() * confetti.width,
        y: -20 - Math.random()*confetti.height*0.3,
        r: 3 + Math.random()*5,
        vy: 2 + Math.random()*4,
        vx: -2 + Math.random()*4,
        rot: Math.random()*Math.PI,
        vr: -0.2 + Math.random()*0.4
      }));

      const start = performance.now();
      cancelAnimationFrame(animId);

      function frame(t){
        const elapsed = t - start;
        ctx.clearRect(0,0,confetti.width,confetti.height);

        for (const p of pieces){
          p.x += p.vx;
          p.y += p.vy;
          p.rot += p.vr;

          // wrap sideways
          if (p.x < -30) p.x = confetti.width + 30;
          if (p.x > confetti.width + 30) p.x = -30;

          ctx.save();
          ctx.translate(p.x, p.y);
          ctx.rotate(p.rot);
          ctx.fillRect(-p.r, -p.r, p.r*2.4, p.r*1.2);
          ctx.restore();
        }

        if (elapsed < ms){
          animId = requestAnimationFrame(frame);
        } else {
          confetti.style.display = "none";
          ctx.clearRect(0,0,confetti.width,confetti.height);
        }
      }
      animId = requestAnimationFrame(frame);
    }

    // Start No somewhere nice
    requestAnimationFrame(() => moveNoRandom());
  </script>
</body>
</html>
