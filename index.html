<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Valentine</title>

<style>
:root{
  --bg1:#ffe3ee;
  --bg2:#fff0f6;
  --card:#ffffff;
  --accent:#ff4d6d;
  --muted:#6c757d;
  --shadow: 0 16px 50px rgba(0,0,0,.14);
  --radius:22px;
}

body{
  margin:0;
  min-height:100vh;
  display:grid;
  place-items:center;
  font-family: system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
  background: radial-gradient(circle at 20% 15%, var(--bg1), var(--bg2));
  overflow:hidden;
}

#heartsLayer{
  position:fixed;
  inset:0;
  pointer-events:none;
  z-index:0;
  overflow:hidden;
  display:none;
}
.heart{
  position:absolute;
  top:-10vh;
  width:28px;
  animation: fall linear infinite;
}
@keyframes fall{
  to { transform: translateY(120vh) rotate(360deg); }
}

.card{
  width:min(820px, 92vw);
  background:var(--card);
  border-radius:var(--radius);
  box-shadow:var(--shadow);
  padding:26px 22px 22px;
  z-index:5;
  position:relative;
}

h1{
  margin: 6px 0 18px;
  text-align:center;
  font-size: clamp(22px, 3vw, 34px);
}

.layout{
  display:grid;
  gap:14px;
  justify-items:center;
}

.mediaWrap{
  width:min(440px, 90%);
  aspect-ratio: 1/1;
  border-radius:18px;
  overflow:hidden;
  background:#f2f2f2;
}
.mediaWrap img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.caption{
  text-align:center;
  color:#3a3a3a;
  font-size:17px;
  font-weight:600;
  min-height:44px;
}

.btnRow{
  display:flex;
  gap:12px;
  justify-content:center;
}
button{
  border:0;
  border-radius:999px;
  padding:12px 18px;
  font-size:16px;
  cursor:pointer;
}
#yesBtn{ background:var(--accent); color:white; }
#noBtn{ background:#e9ecef; }

#celebration{ display:none; position:relative; min-height:520px; }

.celeCenter{
  width:min(420px, 92%);
  margin:auto;
  text-align:center;
  position:relative;
  z-index:6;
}
.celeCaption{
  margin-top:12px;
  font-size:18px;
  font-weight:650;
}

.floatGif{
  position:absolute;
  width:140px;
  height:140px;
  border-radius:16px;
  overflow:hidden;
  box-shadow: 0 12px 22px rgba(0,0,0,.12);
  animation: floaty 2.8s ease-in-out infinite;
}
.floatGif img{ width:100%; height:100%; object-fit:cover; }

@keyframes floaty {
  0%   { transform: translateY(0); }
  50%  { transform: translateY(-10px); }
  100% { transform: translateY(0); }
}

.p1{ left:2%; top:8%; animation-duration:2.6s;}
.p2{ right:2%; top:8%; animation-duration:3.1s;}
.p3{ left:4%; top:42%; animation-duration:2.9s;}
.p4{ right:4%; top:42%; animation-duration:3.3s;}
.p5{ left:10%; bottom:6%; animation-duration:2.7s;}
.p6{ right:10%; bottom:6%; animation-duration:3.2s;}
.p7{ left:50%; bottom:4%; margin-left:-70px; animation-duration:3s;}

.shake{ animation: shake .45s ease-in-out; }
@keyframes shake{
  0%{transform:translate(0,0)}
  25%{transform:translate(-12px,8px)}
  50%{transform:translate(12px,-8px)}
  75%{transform:translate(-10px,6px)}
  100%{transform:translate(0,0)}
}

.fadeIn{ opacity:0; animation:fadeIn 2.6s forwards; }
@keyframes fadeIn{ to{opacity:1;} }
</style>
</head>

<body>

<div id="heartsLayer"></div>

<div class="card" id="card">
<h1 id="question">Do you want to be my Valentine?</h1>

<div id="normalMode" class="layout">
<div class="mediaWrap">
<img id="mainImg" src="rose.gif">
</div>

<div class="caption" id="caption"></div>

<div class="btnRow">
<button id="yesBtn">YES</button>
<button id="noBtn">NO</button>
</div>
</div>

<div id="celebration">
<div class="celeCenter">
<div class="mediaWrap"><img src="milk.gif"></div>
<div class="celeCaption">AHHH HAPPY VALENTINE'S DAY!!! 🥰♥ ILY SM!!!!!!</div>
</div>

<div class="floatGif p1"><img src="sponge.gif"></div>
<div class="floatGif p2"><img src="pooh.gif"></div>
<div class="floatGif p3"><img src="ppj.gif"></div>
<div class="floatGif p4"><img src="milly.gif"></div>
<div class="floatGif p5"><img src="mocha.gif"></div>
<div class="floatGif p6"><img src="gru.gif"></div>
<div class="floatGif p7"><img src="tooth.gif"></div>
</div>
</div>

<audio id="player"></audio>

<script>
const IMG_5053_FILE = "img_5053.jpeg";

const noSteps=[
{img:"luther.jpg",audio:"among1.mp3",caption:"Wowww, you really pressed no? Must be a mistake 😅"},
{img:"denzel.png",audio:"among2.mp3",caption:"You know what they say. Fool me once, shame on me. Fool me twice... stop playing around 😐"},
{img:IMG_5053_FILE,audio:"among3.mp3",caption:"You really don't want to be my valentine that bad? 😞 Fine, press again to confirm it 🤷🏽‍♂️"},
{img:"alex.jpg",audio:"among4.mp3",caption:"LISTEN UP YOU CHOCOLATE COVERED GIRAFFE 🤬 BE MY VALENTINE NOW!",shake:true},
{img:"chris.jpg",audio:"chris.mp3",caption:"You asked for it, now its time to find out 🥊",fadeIn:true}
];

let noCount=0;
let celebrating=false;

const mainImg=document.getElementById("mainImg");
const caption=document.getElementById("caption");
const yesBtn=document.getElementById("yesBtn");
const noBtn=document.getElementById("noBtn");
const player=document.getElementById("player");
const card=document.getElementById("card");

function playAudio(src){
player.pause();
player.currentTime=0;
player.loop=false;
player.src=src;
player.play();
}

function applyStep(i){
const s=noSteps[i];
mainImg.classList.remove("fadeIn");
void mainImg.offsetWidth;
mainImg.src=s.img;
if(s.fadeIn) mainImg.classList.add("fadeIn");
caption.textContent=s.caption;
playAudio(s.audio);
if(s.shake){ card.classList.add("shake"); setTimeout(()=>card.classList.remove("shake"),450); }
}

noBtn.onclick=()=>{
if(celebrating) return;
noCount++;
applyStep(Math.min(noCount,noSteps.length)-1);
};

yesBtn.onclick=()=>{
celebrating=true;
document.getElementById("normalMode").style.display="none";
document.getElementById("celebration").style.display="block";
player.loop=true;
playAudio("valentine.mp3");
startHearts();
};

function startHearts(){
const layer=document.getElementById("heartsLayer");
layer.style.display="block";
for(let i=0;i<30;i++){
const h=document.createElement("img");
h.src="heart.png";
h.className="heart";
h.style.left=Math.random()*100+"vw";
h.style.animationDuration=(3+Math.random()*4)+"s";
layer.appendChild(h);
}
}
</script>

</body>
</html>
